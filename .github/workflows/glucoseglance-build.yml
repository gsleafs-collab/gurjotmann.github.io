name: GlucoseGlance build

on:
  push:
    paths:
      - "GlucoseGlance/**"
      - ".github/workflows/glucoseglance-build.yml"
  pull_request:
    paths:
      - "GlucoseGlance/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: GlucoseGlance
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for simulator (no signing)
        run: |
          xcodebuild build \
            -project GlucoseGlance.xcodeproj \
            -scheme GlucoseGlance \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
