name: GlucoseGlance

options:
  bundleIdPrefix: com.gurjotmann
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""          # Set your Apple Developer Team ID here
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  GlucoseGlance:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: GlucoseGlanceWidgets
    entitlements:
      path: App/GlucoseGlance.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gurjotmann.glucoseglance
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.gurjotmann.glucoseglance.shared"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Glucose Glance
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.gurjotmann.glucoseglance.refresh
        AppGroupIdentifier: group.com.gurjotmann.glucoseglance
        KeychainAccessGroup: "$(AppIdentifierPrefix)com.gurjotmann.glucoseglance.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gurjotmann.glucoseglance
    scheme: {}

  GlucoseGlanceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/GlucoseGlanceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gurjotmann.glucoseglance
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.gurjotmann.glucoseglance.shared"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Glucose Glance
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupIdentifier: group.com.gurjotmann.glucoseglance
        KeychainAccessGroup: "$(AppIdentifierPrefix)com.gurjotmann.glucoseglance.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gurjotmann.glucoseglance.widgets
